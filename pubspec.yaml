name: flutter_network_doctor
description: Production-grade Flutter network diagnostics with internet, DNS, TCP/TLS, IP routes, gateway reachability, and TCP quality sampling.
version: 0.3.1
homepage: https://github.com/malikdoksoz/flutter_network_doctor
repository: https://github.com/malikdoksoz/flutter_network_doctor
issue_tracker: https://github.com/malikdoksoz/flutter_network_doctor/issues

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

topics:
  - network
  - diagnostics
  - connectivity
  - wifi
  - internet

dependencies:
  connectivity_plus: ^7.3.1
  connectivity_plus_platform_interface: ^2.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.6.0
  network_info_plus: ^8.2.1
  network_info_plus_platform_interface: ^3.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.malikdoksoz.flutter_network_doctor
        pluginClass: FlutterNetworkDoctorPlugin
      ios:
        pluginClass: FlutterNetworkDoctorPlugin
      linux:
        dartPluginClass: FlutterNetworkDoctorDartPlugin
      macos:
        pluginClass: FlutterNetworkDoctorPlugin
      web:
        pluginClass: FlutterNetworkDoctorWeb
        fileName: flutter_network_doctor_web.dart
      windows:
        dartPluginClass: FlutterNetworkDoctorDartPlugin
