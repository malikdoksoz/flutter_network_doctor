include: package:flutter_lints/flutter.yaml

# Platform host projects and build output are not part of the Dart sources of
# this package. `flutter analyze` writes this section itself when it is missing,
# which leaves a dirty tree behind and fails `dart pub publish --dry-run` in CI,
# so it is checked in.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**

linter:
  rules:
    public_member_api_docs: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    directives_ordering: true
    prefer_final_locals: true
    unnecessary_lambdas: true
