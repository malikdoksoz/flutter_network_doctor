name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome
      - run: flutter test
        working-directory: example
      - run: dart pub publish --dry-run

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: iOS
            os: macos-latest
            command: flutter build ios --simulator --no-codesign
          - target: Linux
            os: ubuntu-latest
            command: flutter build linux
          - target: macOS
            os: macos-latest
            command: flutter build macos
          - target: Web
            os: ubuntu-latest
            command: flutter build web --wasm
          - target: Windows
            os: windows-latest
            command: flutter build windows
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.target == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev ninja-build
      - run: flutter pub get
      - run: ${{ matrix.command }}

  integration:
    name: Integration ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Web
            os: ubuntu-latest
            command: xvfb-run -a flutter drive --driver=test_driver/integration_test.dart --target=integration_test/network_doctor_integration_test.dart -d chrome --chrome-binary="$CHROME_EXECUTABLE"
          - target: Linux
            os: ubuntu-latest
            command: xvfb-run -a flutter test integration_test/network_doctor_integration_test.dart -d linux
          - target: macOS
            os: macos-latest
            command: flutter test integration_test/network_doctor_integration_test.dart -d macos
          - target: Windows
            os: windows-latest
            command: flutter test integration_test/network_doctor_integration_test.dart -d windows
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux runtime dependencies
        if: matrix.target == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev ninja-build xvfb
      - name: Install Web runtime dependencies
        if: matrix.target == 'Web'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Enable Chrome sandbox support
        if: matrix.target == 'Web'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        if: matrix.target == 'Web'
        with:
          install-chromedriver: true
      - name: Start ChromeDriver
        if: matrix.target == 'Web'
        run: chromedriver --port=4444 &
      - run: flutter pub get
      - run: ${{ matrix.command }}
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

  integration-android:
    name: Integration Android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: example
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: example
          script: flutter test integration_test/network_doctor_integration_test.dart -d emulator-5554

  integration-ios:
    name: Integration iOS
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "IOS_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - run: flutter test integration_test/network_doctor_integration_test.dart -d "$IOS_DEVICE_ID"
