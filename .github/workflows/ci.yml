name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome
      - run: flutter test
        working-directory: example
      - run: dart pub publish --dry-run

  build-pr:
    name: PR Build ${{ matrix.target }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: iOS
            os: macos-latest
            command: flutter build ios --simulator --no-codesign
          - target: Web
            os: ubuntu-latest
            command: flutter build web --wasm
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.command }}

  integration:
    name: Integration ${{ matrix.target }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            os: ubuntu-latest
            command: xvfb-run -a flutter test integration_test/network_doctor_integration_test.dart -d linux
          - target: macOS
            os: macos-latest
            command: flutter test integration_test/network_doctor_integration_test.dart -d macos
          - target: Windows
            os: windows-latest
            command: flutter test integration_test/network_doctor_integration_test.dart -d windows
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux runtime dependencies
        if: matrix.target == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev ninja-build xvfb
      - run: flutter pub get
      - run: ${{ matrix.command }}

  integration-android:
    name: Integration Android
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: example
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: example
          script: flutter test integration_test/network_doctor_integration_test.dart -d emulator-5554

  integration-ios:
    name: Integration iOS
    if: github.event_name == 'workflow_dispatch'
    needs: test
    # `connectivity_plus` reads `NWPath.isUltraConstrained`, which exists only
    # in the iOS 26 SDK, so an older image cannot compile the pod at all. On
    # this image Flutter 3.44 then finished the Xcode build and hung installing
    # on the simulator picked by default, silent until the job timed out.
    # Pinning the selection to the lowest runtime present cleared that. The
    # image carries no runtime older than iOS 26, so this is a choice between
    # 26.x releases rather than a way to avoid iOS 26.
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot an iPhone simulator
        run: |
          # The image carried iOS 26.2, 26.4 and 26.5 when this was written, and
          # only 26.2 worked. Record the list so a change in what ships here is
          # visible in the log instead of arriving as another silent timeout.
          xcrun simctl list runtimes available

          DEVICE=$(xcrun simctl list devices available -j | jq -c '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)")) as $v
              | .value[]
              | select(.name | startswith("iPhone"))
              | {
                  udid,
                  name,
                  runtime: "\($v.major).\($v.minor)",
                  order: (($v.major | tonumber) * 1000 + ($v.minor | tonumber))
                }
            ]
            | sort_by(.order)
            | first // empty')
          test -n "$DEVICE"

          DEVICE_ID=$(jq -r '.udid' <<<"$DEVICE")
          echo "Selected $(jq -r '.name' <<<"$DEVICE") on iOS $(jq -r '.runtime' <<<"$DEVICE")"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "IOS_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run iOS integration test
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/network_doctor_integration_test.dart -d "$IOS_DEVICE_ID" --timeout=300
