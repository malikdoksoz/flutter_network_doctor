name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    name: Release Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: iOS
            os: macos-latest
            command: flutter build ios --simulator --no-codesign
          - target: Linux
            os: ubuntu-latest
            command: flutter build linux
          - target: macOS
            os: macos-latest
            command: flutter build macos
          - target: Web
            os: ubuntu-latest
            command: flutter build web --wasm
          - target: Windows
            os: windows-latest
            command: flutter build windows
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.target == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev ninja-build
      - run: flutter pub get
      - run: ${{ matrix.command }}
